<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhishScope</title><style>
:root{--bg:#e9edf1;--p:#fff;--ink:#14212b;--mu:#5b6b78;--ln:#d5dce2;--ac:#0e6b73;--rd:#b8322a;--am:#c98a12;--gn:#2f7d4f;--bl:#3a6ea5}
@media(prefers-color-scheme:dark){:root{--bg:#10181f;--p:#18232c;--ink:#e6edf2;--mu:#93a3b0;--ln:#2a3945;--ac:#47b5bd}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 "Segoe UI","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
nav{width:210px;background:#14212b;color:#cfd9e0;padding:18px 12px;flex:none}nav h1{font-size:19px;margin:0 8px 18px;color:#fff;letter-spacing:.3px}
nav a{display:block;padding:9px 12px;border-radius:6px;color:inherit;text-decoration:none;cursor:pointer;margin-bottom:2px}nav a.on,nav a:hover{background:#22384a;color:#fff}
main{flex:1;padding:24px 28px;min-width:0}h2{margin:0 0 14px;font-size:22px}h3{margin:18px 0 8px;font-size:16px}
.card{background:var(--p);border:1px solid var(--ln);border-radius:8px;padding:16px;margin-bottom:14px}.row{display:flex;gap:14px;flex-wrap:wrap}.row>*{flex:1;min-width:230px}
.stat b{font-size:30px;display:block}.mu{color:var(--mu)}.mono{font:12px ui-monospace,Consolas,monospace;word-break:break-all}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln)}th{font-weight:600;cursor:pointer;color:var(--mu)}tr.click:hover{background:rgba(14,107,115,.08);cursor:pointer}
.tag{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;font-weight:600;color:#fff;background:var(--mu)}
.CRITICAL,.high,.HIGH,.FAIL,.fail{background:var(--rd)}.MEDIUM,.medium{background:var(--am)}.LOW,.low,.pass{background:var(--gn)}
button,select,input,textarea{font:inherit;color:inherit}button{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}button.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--am)}
input,select,textarea{background:var(--p);border:1px solid var(--ln);border-radius:6px;padding:7px 9px}textarea{width:100%;height:130px}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:2px solid var(--ln);flex-wrap:wrap}.tabs a{padding:8px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}.tabs a.on{border-color:var(--ac);font-weight:600}
.bar{height:12px;background:var(--ln);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%}
.chain{display:flex;flex-wrap:wrap;gap:0;align-items:center}.hop{border:2px solid var(--ln);border-radius:8px;padding:10px 12px;background:var(--p);cursor:pointer;min-width:150px}.hop.on{border-color:var(--ac)}.hop.warn{border-color:var(--am)}.arrow{padding:0 8px;color:var(--mu)}
.chip{background:rgba(14,107,115,.14);color:var(--ac);border-radius:4px;padding:0 6px;font-size:12px;cursor:pointer;margin-left:4px;font-weight:600}.hl{outline:3px solid var(--am);background:rgba(201,138,18,.15)}
.sig{display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--ln)}.sig span{flex:1}
.drop{border:2px dashed var(--ln);border-radius:8px;padding:26px;text-align:center;cursor:pointer}.drop.on{border-color:var(--ac)}
svg text{fill:var(--ink);font-size:11px}.node{cursor:pointer}mark{background:rgba(201,138,18,.35);color:inherit}.side{border-left:4px solid var(--ac)}
@media(max-width:760px){body{flex-direction:column}nav{width:100%;display:flex;gap:4px;flex-wrap:wrap}nav h1{width:100%;margin-bottom:6px}main{padding:14px}}
</style></head><body>
<nav><h1>PhishScope</h1><a data-v="dash">Dashboard</a><a data-v="new">New investigation</a><a data-v="cases">Cases</a><a data-v="iocs">Indicators</a></nav>
<main id="m"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api=(u,o)=>fetch(u,o).then(r=>r.json()),post=(u,b)=>api(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
const tag=t=>`<span class="tag ${esc(t)}">${esc(t)}</span>`,fmt=s=>s>=60?Math.floor(s/60)+"m "+(s%60)+"s":s+"s";
let C=null,tab="overview",T=0,sel=null,off={},hop=0,cf="all",sortk="delivered_at",q="";
document.querySelectorAll("nav a").forEach(a=>a.onclick=()=>go(a.dataset.v));
async function go(v){document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.v==v));
 if(v=="dash"){const d=await api("/api/dashboard"),cs=await api("/api/cases");$("#m").innerHTML=`<h2>Dashboard</h2><div class="row">${[["Open cases",d.open],["High risk",d.high],["Campaigns",d.campaigns],["Clicks",d.clicks]].map(x=>`<div class="card stat"><span class="mu">${x[0]}</span><b>${x[1]}</b></div>`).join("")}</div><div class="card"><h3 style="margin-top:0">Recent investigations</h3>${caseTable(cs.slice(0,8))}</div>`}
 if(v=="cases"){$("#m").innerHTML=`<h2>Cases</h2><div class="card">${caseTable(await api("/api/cases"))}</div>`}
 if(v=="new")$("#m").innerHTML=`<h2>New investigation</h2><div class="card"><label class="drop" id="dz"><input id="f" type="file" accept=".eml,.txt" hidden><b>Drop a reported .eml here</b><br><span class="mu">or click to choose. Raw headers can be pasted below.</span><div id="fn" class="mono"></div></label><h3>Paste raw email</h3><textarea id="t" class="mono"></textarea><div class="row" style="margin-top:10px"><label>Simulated recipients<br><input id="n" type="number" value="100" min="10" max="500"></label><label>Reputation mode<br><select id="md"><option value="enterprise">Enterprise: hash/domain lookups only</option><option value="lab">Lab: full URL lookups</option></select></label></div><p><button id="go">Investigate</button> <button class="g" id="sm">Run phishing sample</button> <button class="g" id="sb2">Run benign sample</button> <a href="/api/lab/sample.eml">Download sample .eml</a></p><p id="er" style="color:var(--rd)"></p></div>`,
 $("#f").onchange=e=>$("#fn").textContent=e.target.files[0]?.name,
 $("#go").onclick=async()=>{const fd=new FormData();if($("#f").files[0])fd.append("file",$("#f").files[0]);fd.append("text",$("#t").value);fd.append("n",$("#n").value);fd.append("mode",$("#md").value);const r=await api("/api/analyze",{method:"POST",body:fd});r.error?$("#er").textContent=r.error:open_(r.id)},
 $("#sm").onclick=async()=>open_((await post("/api/lab/sample",{})).id);$("#sb2").onclick=async()=>open_((await post("/api/lab/sample?kind=benign",{})).id);
 if(v=="iocs"){const o=await api("/api/iocs");$("#m").innerHTML=`<h2>Indicators</h2><div class="card"><table><tr><th>Type<th>Value<th>Cases<th>Recipients<th>Clicks<th>Reputation<th>First seen</tr>${o.map(x=>`<tr><td>${esc(x.type)}<td class="mono">${esc(x.value)}<td>${x.cases.map(c=>`<a href="#" onclick="open_(${c});return false">INC-${c}</a>`).join(", ")}<td>${x.recipients}<td>${x.clicks}<td>${x.rep?(x.rep.malicious>=3?tag("high")+" ":"")+x.rep.malicious+" malicious ("+esc(x.rep.source)+")":"-"}<td>${esc(x.first_seen.slice(0,16))}`).join("")||"<tr><td>No indicators yet. Start an investigation.</tr>"}</table></div>`}}
const caseTable=cs=>`<table><tr><th>Case<th>Title<th>Severity<th>Status<th>Created</tr>${cs.map(c=>`<tr class="click" onclick="open_(${c.id})"><td>INC-${String(c.id).padStart(4,"0")}<td>${esc(c.title)}<td>${tag(c.severity)}<td>${esc(c.status)}<td>${esc(c.created.slice(0,16))}`).join("")||"<tr><td colspan=5>No cases yet. Start a new investigation.</tr>"}</table>`;
async function open_(id){C=await api("/api/case/"+id);tab="overview";T=0;sel=null;off={};hop=0;cf="all";$("#m").dataset.id=id;draw()}
function score(){const s=C.data.signals;return Math.min(100,s.reduce((a,x)=>a+((x.fired&&!off[x.key])||(!x.fired&&off[x.key]===2)?x.weight:0),0))}
function lvl(s){return s>=80?"CRITICAL":s>=60?"HIGH":s>=30?"MEDIUM":"LOW"}
function draw(){const d=C.data,tabs=[["overview","Overview"],["headers","Headers & auth"],["content","Content"],["campaign","Campaign"],["replay","Replay & graph"],["case","Case & response"]];
 $("#m").innerHTML=`<h2>INC-${String(C.id).padStart(4,"0")}: ${esc(C.title)}</h2><div class="tabs">${tabs.map(t=>`<a class="${tab==t[0]?"on":""}" onclick="tab='${t[0]}';draw()">${t[1]}</a>`).join("")}</div><div id="tb"></div>`;V[tab]()}
const A=()=>C.data.campaign;
const V={
overview(){const d=C.data,s=score(),col=s>=60?"var(--rd)":s>=30?"var(--am)":"var(--gn)";
 $("#tb").innerHTML=`<div class="row"><div class="card"><span class="mu">Investigation risk score (not a probability)</span><div style="font-size:42px;font-weight:700" id="sc">${s}</div><div class="bar"><i id="sb" style="width:${s}%;background:${col}"></i></div><p>${tag(lvl(s))} ${esc(d.verdict)}</p></div><div class="card"><h3 style="margin-top:0">Analyst summary</h3>${d.summary.map(x=>`<p>${esc(x.t)} ${x.ev.map(e=>`<span class="chip" onclick="hl('${e}')">${e}</span>`).join("")}</p>`).join("")}<span class="mu">Every sentence cites evidence IDs from the signals below.</span></div></div>
 <div class="card"><h3 style="margin-top:0">Evidence and what-if scoring</h3><span class="mu">Toggle a signal to see how the score and verdict change.</span>${d.signals.map(x=>`<div class="sig" id="${x.id}"><input type="checkbox" aria-label="${esc(x.label)}" ${(x.fired&&!off[x.key])||off[x.key]===2?"checked":""} onchange="tg('${x.key}',this.checked,${x.fired})"><b>${x.id}</b><span>${esc(x.label)} <span class="mu">${esc(x.evidence)}</span></span><b>+${x.weight}</b></div>`).join("")}</div>`},
headers(){const d=C.data,a=d.auth,i=d.identity,h=d.hops[hop];
 $("#tb").innerHTML=`<div class="card"><h3 style="margin-top:0">Received chain (origin to mailbox)</h3><div class="chain">${d.hops.map((x,k)=>`${k?'<span class="arrow">&rarr;</span>':""}<div class="hop ${k==hop?"on":""} ${x.flags.some(f=>f.includes("back"))?"warn":""}" onclick="hop=${k};V.headers()"><b>${esc(x.frm)}</b><br><span class="mono">${esc(x.ip)||"no IP"}</span></div>`).join("")}</div>${h?`<div class="side card" style="margin-top:12px"><b>Hop ${hop+1}</b><br>From <span class="mono">${esc(h.frm)}</span> by <span class="mono">${esc(h.by)}</span><br>IP <span class="mono">${esc(h.ip)||"-"}</span> | Time ${esc(h.time)||"unparsed"}<br>${h.flags.map(f=>`<span class="tag ${f.includes("back")?"high":"MEDIUM"}">${esc(f)}</span>`).join(" ")}<br><span class="mu">Geo/ASN/rDNS enrichment is not bundled; plug a MaxMind or RDAP adapter into the hop panel.</span></div>`:""}</div>
 <div class="row">${[["SPF",a.spf,a.spf_aligned],["DKIM",a.dkim,a.dkim_aligned],["DMARC",a.dmarc,a.spf_aligned||a.dkim_aligned]].map((x,k)=>`<div class="card"><b>${x[0]}</b> <span class="tag ${x[1]=="pass"?"pass":x[1]=="none"?"":"fail"}">${a.evaluated?esc(x[1]):"not evaluated"}</span><p>${esc(a.why[k])}</p><span class="mu">Aligned: ${x[2]?"yes":"no"}</span></div>`).join("")}</div>
 <div class="card"><h3 style="margin-top:0">Identity</h3><table>${[["From",i.from_name+" <"+i.from_addr+">"],["Return-Path",i.return_path],["Reply-To",i.reply_to+(i.replyto_mismatch?"  (differs from From)":"")],["Message-ID",d.meta.message_id],["Display-name spoofing",i.spoof?"suspected":"not detected"],["Lookalike domain",i.lookalike?"imitates "+i.lookalike:"none"]].map(r=>`<tr><td>${r[0]}<td class="mono">${esc(r[1])||"-"}`).join("")}</table></div>`},
content(){const d=C.data;let p=esc(d.preview);d.urgency.forEach(w=>p=p.replace(new RegExp(w,"gi"),m=>`<mark>${m}</mark>`));
 $("#tb").innerHTML=`<div class="card"><h3 style="margin-top:0">URLs (defanged, never fetched by this server)</h3><table><tr><th>URL<th>Reputation<th>Flags</tr>${d.urls.map(u=>`<tr><td class="mono">${esc(u.defanged)}${u.text?`<br><span class="mu">shown as: ${esc(u.text)}</span>`:""}<td><div class="bar"><i style="width:${Math.min(100,u.rep.malicious*10)}%;background:var(--rd)"></i></div>${u.rep.malicious} malicious, ${u.rep.suspicious} suspicious <span class="mu">(${esc(u.rep.source)})</span><td>${[u.mismatch&&"link text mismatch",u.lookalike&&"imitates "+u.lookalike,u.shortener&&"shortener"].filter(Boolean).map(esc).join(", ")||"-"}`).join("")||"<tr><td>No URLs found</tr>"}</table></div>
 <div class="card"><h3 style="margin-top:0">Attachments</h3><table><tr><th>Name<th>SHA-256<th>Risk</tr>${d.attachments.map(a=>`<tr><td>${esc(a.name)}<td class="mono">${a.sha256}<td>${a.risky?tag("high"):tag("low")}`).join("")||"<tr><td>None</tr>"}</table></div>
 <div class="card"><h3 style="margin-top:0">Safe text preview</h3><pre style="white-space:pre-wrap">${p}</pre></div>`},
campaign(){let r=A().filter(x=>cf=="all"||(cf=="clicked"&&x.clicked)||(cf=="submitted"&&x.submitted)||(cf=="blocked"&&x.status=="blocked")).filter(x=>x.email.includes(q));
 r=[...r].sort((a,b)=>sortk=="email"?a.email.localeCompare(b.email):(a[sortk]??1e9)-(b[sortk]??1e9));
 const all=A();$("#tb").innerHTML=`<div class="row">${[["Recipients",all.length],["Delivered",all.filter(x=>x.status=="delivered").length],["Blocked",all.filter(x=>x.status=="blocked").length],["Clicked",all.filter(x=>x.clicked).length],["Credentials",all.filter(x=>x.submitted).length]].map(x=>`<div class="card stat"><span class="mu">${x[0]}</span><b>${x[1]}</b></div>`).join("")}</div>
 <div class="card"><p>${["all","clicked","submitted","blocked"].map(f=>`<button class="${cf==f?"":"g"}" onclick="cf='${f}';V.campaign()">${f}</button>`).join(" ")} <input placeholder="Search user" value="${esc(q)}" oninput="q=this.value;clearTimeout(window.qt);window.qt=setTimeout(()=>{V.campaign();$('input[placeholder]').focus()},250)"></p><div class="row"><div style="flex:2;overflow:auto;max-height:480px"><table><tr><th onclick="sortk='email';V.campaign()">User<th>Dept<th onclick="sortk='delivered_at';V.campaign()">Delivered<th onclick="sortk='click_at';V.campaign()">Clicked<th>Risk</tr>${r.map(x=>`<tr class="click" onclick="sel='${x.email}';V.campaign()"><td>${esc(x.email)}<td>${esc(x.dept)}<td>${x.status=="blocked"?"blocked":"+"+fmt(x.delivered_at)}<td>${x.clicked?"+"+fmt(x.click_at):"-"}<td>${tag(x.risk)}`).join("")}</table></div>${sel?uDetail():""}</div></div>`},
replay(){const mx=Math.max(...A().map(x=>x.submit_at||x.click_at||x.delivered_at))+60;
 $("#tb").innerHTML=`<div class="card"><label>Replay incident: <b id="tl">+${fmt(T)}</b> <input type="range" id="rg" min="0" max="${mx}" value="${T}" style="width:60%"></label> <label><input type="checkbox" id="ck"> clickers only</label><div id="gr"></div><span class="mu">Grey: not yet delivered. Blue: delivered. Amber: clicked. Red: submitted credentials. Hollow: blocked.</span></div><div id="dt"></div><div class="card"><h3 style="margin-top:0">Event log</h3><div id="ev"></div></div>`;
 const up=()=>{T=+$("#rg").value;$("#tl").textContent="+"+fmt(T);graph();evl()};$("#rg").oninput=up;$("#ck").onchange=up;up()},
case(){const s=C.status;$("#tb").innerHTML=`<div class="row"><div class="card"><h3 style="margin-top:0">Case status</h3><select onchange="post('/api/case/${C.id}/status',{status:this.value}).then(()=>open_(${C.id}))">${["NEW","INVESTIGATING","CONTAINED","RESOLVED","FALSE POSITIVE"].map(x=>`<option ${x==s?"selected":""}>${x}</option>`).join("")}</select> <a href="/api/case/${C.id}/report.md">Export report</a>
 <h3>Recommended response (dry run)</h3>${C.data.recommended.map(r=>`<p><button class="g" onclick="act(this,'${esc(r)}')">Run</button> ${esc(r)}</p>`).join("")}<p id="am" class="mu"></p></div>
 <div class="card"><h3 style="margin-top:0">Investigation notes</h3>${C.notes.map(n=>`<p><span class="mu">${esc(n.ts.slice(0,16))}</span> ${esc(n.body)}</p>`).join("")||'<p class="mu">No notes yet.</p>'}<textarea id="nt" style="height:70px"></textarea><p><button onclick="post('/api/case/${C.id}/note',{body:$('#nt').value}).then(()=>open_(${C.id}))">Add note</button></p><h3>Audit trail</h3>${C.audit.map(a=>`<div class="mono">${esc(a.ts.slice(11,19))} ${esc(a.action)} ${esc(a.detail)}</div>`).join("")}</div></div>`}};
function hl(id){document.getElementById(id).scrollIntoView({block:"center"});document.getElementById(id).classList.add("hl");setTimeout(()=>document.getElementById(id).classList.remove("hl"),1800)}
function tg(k,c,f){off[k]=c==f?undefined:(f?1:2);V.overview()}
async function act(b,a){const r=await post(`/api/case/${C.id}/action`,{action:a});b.disabled=true;$("#am").textContent=a+": "+r.targets+" targets. "+r.note}
function uDetail(){const x=A().find(u=>u.email==sel);if(!x)return"";const dw=x.clicked?x.click_at-x.delivered_at:0;
 return`<div class="side card" style="flex:1"><b>${esc(x.name)}</b> ${tag(x.risk)}<br><span class="mono">${esc(x.email)}</span><p>Delivered +${fmt(x.delivered_at)}${x.clicked?`<br>Clicked +${fmt(x.click_at)} (${fmt(dw)} after delivery)<br>HTTP ${x.http} | ${esc(x.ip)} | ${esc(x.ua)}`:""}</p><p>${x.submitted?"<b>Login page loaded and form submitted. Reset credentials, revoke sessions, review sign-ins.</b>":x.clicked?(x.http==200?"Login page loaded. Treat credentials as potentially exposed.":"Destination blocked (HTTP "+x.http+"). Low exposure."):x.status=="blocked"?"Blocked before delivery.":"No click observed."}</p></div>`}
function st(x){return x.status=="blocked"?"blocked":x.submitted&&T>=x.submit_at?"red":x.clicked&&T>=x.click_at?"amber":T>=x.delivered_at?"blue":"grey"}
function graph(){const cols={red:"var(--rd)",amber:"var(--am)",blue:"var(--bl)",grey:"var(--ln)",blocked:"none"},w=$("#ck").checked;let r=A().filter(x=>!w||x.clicked).slice(0,120);const R=190,cx=330,cy=235;
 let s=`<svg viewBox="0 0 660 470" width="100%" role="img" aria-label="Campaign graph">`;
 r.forEach((x,i)=>{const a=i/r.length*6.283,px=cx+R*Math.cos(a),py=cy+R*Math.sin(a),k=st(x);s+=`<line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="var(--ln)"/><circle class="node" cx="${px}" cy="${py}" r="${sel==x.email?9:6}" fill="${cols[k]}" stroke="${k=="blocked"?"var(--mu)":"var(--ink)"}" onclick="sel='${x.email}';detail()"><title>${esc(x.email)}</title></circle>`});
 s+=`<circle cx="${cx}" cy="${cy}" r="34" fill="var(--ac)"/><text x="${cx}" y="${cy+3}" text-anchor="middle" style="fill:#fff">sender</text><text x="${cx}" y="${cy+52}" text-anchor="middle">${esc(C.data.identity.from_domain)}</text></svg>`;$("#gr").innerHTML=s}
function detail(){$("#dt").innerHTML=uDetail();graph()}
function evl(){const E=[];A().forEach(x=>{if(x.status=="blocked")return;E.push([x.delivered_at,x.email+" received the email"]);if(x.clicked)E.push([x.click_at,x.email+" clicked the link (HTTP "+x.http+")"]);if(x.submitted)E.push([x.submit_at,x.email+" submitted credentials"])});
 E.sort((a,b)=>a[0]-b[0]);const v=E.filter(e=>e[0]<=T);$("#ev").innerHTML=`<div class="mu">${v.length} of ${E.length} events</div><div style="max-height:220px;overflow:auto">`+v.slice(-40).reverse().map(e=>`<div>+${fmt(e[0])} ${esc(e[1])}</div>`).join("")+"</div>"}
go("dash");
</script></body></html>
